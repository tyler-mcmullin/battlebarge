<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h2 mat-dialog-title>Add a perk or scar</h2>

  <mat-dialog-content class="dialog-form">
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
      <mat-error>{{ message(form.controls.name) }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput rows="3" formControlName="description"></textarea>
      <mat-hint align="end"
        >{{ form.controls.description.value.length }} / {{ limits.perkDescription }}</mat-hint
      >
      <mat-error>{{ message(form.controls.description) }}</mat-error>
    </mat-form-field>

    <mat-slide-toggle formControlName="is_scar"
      >This is a battle scar (counts against crusade points)</mat-slide-toggle
    >
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button type="submit" [disabled]="busy()">
      @if (busy()) {
        <mat-spinner diameter="20" />
      } @else {
        Add
      }
    </button>
  </mat-dialog-actions>
</form>
